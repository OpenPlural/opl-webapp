@let member = this.member();
<app-popup-page-container [title]="member ? member.name : ''">
  <main>
    @if (member) {
      @let tab = selectedTab();
      <app-pager [currentPage]="tab" placement="top-29" rounding="rounded-b-lg" justify="justify-between">
        <app-toggle-icon-button name="navigation.profile" icon="fa-user" size="fa-lg" [toggled]="tab === 'profile'" (toggle)="selectedTab.set('profile')" />
        <app-toggle-icon-button name="navigation.customFields" icon="fa-list-ul" size="fa-lg" [toggled]="tab === 'customFields'" (toggle)="showCustomFields()" [disabled]="member.custom" />
      </app-pager>
      <div class="scroll-container flex flex-col">
        <div class="pt-10 p-5 overflow-y-auto">
          @switch (tab) {
            @case ('profile') {
              <app-member-profile-page [member]="member!" [folders]="folders()" [editable]="false" />
            }
            @case ('customFields') {
              @let customFields = this.customFields();
              @if (customFields) {
                <app-friend-member-custom-fields-page [fields]="customFields" />
              } @else {
                <app-loading />
              }
            }
          }
        </div>
      </div>
    } @else {
      <app-loading />
    }
  </main>
</app-popup-page-container>

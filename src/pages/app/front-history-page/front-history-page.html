@let tab = selectedTab();
<app-nav-page-container [fab]="true" [scrollable]="tab === 'textual'" (fabAction)="createFront.set(true)">
  <main>
    <app-pager [currentPage]="tab" [showTitle]="false" justify="justify-between">
      <app-toggle-icon-button name="front.labels.history.graphical" icon="fa-bar-chart" size="fa-lg" [toggled]="tab === 'graphical'" (toggle)="selectedTab.set('graphical')" />
      <app-toggle-icon-button name="front.labels.history.textual" icon="fa-list-ul" size="fa-lg" [toggled]="tab === 'textual'" (toggle)="selectedTab.set('textual')" />
    </app-pager>
    @switch (tab) {
      @case ('graphical') {
        <app-front-history-graphical-page />
      }
      @case ('textual') {
        <app-front-history-textual-page />
      }
    }
  </main>
  <i class="fa fa-plus"></i>
</app-nav-page-container>


@if (createFront()) {
  <app-member-selector dialogId="createFrontMemberPrompt" title="front.actions.create" [selectMultiple]="false"
                       (submitSelection)="createFront.set(false); createFrontMember.set($event[0]); openDialog('createFrontEntryTimePrompt')"
                       (forceClose)="createFront.set(false)" />
}

<dialog id="createFrontEntryTimePrompt" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{'front.actions.create' | translate}}</h3>
    <form method="dialog" class="w-full" (submit)="createFrontTime($event)">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">{{'front.labels.startTime' | translate}}</legend>
        <input name="startTime" type="datetime-local" class="input w-full">
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">{{'front.labels.endTime' | translate}}</legend>
        <input name="endTime" type="datetime-local" class="input w-full">
      </fieldset>
      <button type="submit" class="mx-auto mt-5 block btn btn-success">{{'actions.confirm' | translate}}</button>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button></button>
  </form>
</dialog>

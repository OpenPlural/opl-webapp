@let tab = selectedTab();
<app-nav-page-container [scrollable]="tab === 'textual'">
  <main>
    <app-pager [currentPage]="tab" [showTitle]="false" justify="justify-between">
      <app-toggle-icon-button name="front.labels.history.graphical" icon="fa-bar-chart" size="fa-lg" [toggled]="tab === 'graphical'" (toggle)="selectedTab.set('graphical')" />
      <app-toggle-icon-button name="front.labels.history.textual" icon="fa-list-ul" size="fa-lg" [toggled]="tab === 'textual'" (toggle)="selectedTab.set('textual')" />
    </app-pager>
    @switch (tab) {
      @case ('graphical') {
        <app-front-history-graphical-page />
      }
      @case ('textual') {
        <app-front-history-textual-page />
      }
    }
  </main>
</app-nav-page-container>

<app-nav-page-container>
  <main>
    <div class="mx-2 mt-2">
      <h3 class="text-center text-lg font-bold">{{'dataExport.labels.' + exportFormat() | translate}}</h3>
      <div class="text-center my-6">
        <div>{{'dataExport.labels.text' | translate}}</div>
        <div class="mt-2.5">{{'dataExport.labels.cooldown' | translate}}</div>
      </div>
      <div class="text-center mt-2">
        <button type="submit" class="btn btn-primary w-full sm:w-1/2 md:w-1/3" [disabled]="exporting()" (click)="exportData()">
          @if (exporting()) {
            <span class="loading loading-spinner"></span>
          }
          {{'dataExport.actions.export' | translate}}
        </button>
      </div>
    </div>
  </main>
</app-nav-page-container>

<app-nav-page-container>
  <main>
    <form id="importForm" class="mx-2 mt-2" (submit)="importData($event)">
      <h3 class="text-center text-lg font-bold">{{'dataImport.labels.' + importFormat() | translate}}</h3>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">{{'dataImport.labels.file' | translate}}</legend>
        <input name="file" type="file" accept="application/json" class="w-full file-input" />
      </fieldset>
      <fieldset class="fieldset border-base-100 rounded-box w-full border-2 p-4">
        <legend class="fieldset-legend">{{'dataImport.labels.flags' | translate}}</legend>
        <label class="label">
          <input name="folders" type="checkbox" class="checkbox" checked />
          {{'dataImport.labels.folders' | translate}}
        </label>
        <label class="label">
          <input name="members" type="checkbox" class="checkbox" checked />
          {{'dataImport.labels.members' | translate}}
        </label>
        <label class="label">
          <input name="customFront" type="checkbox" class="checkbox" checked />
          {{'dataImport.labels.customFront' | translate}}
        </label>
        <label class="label">
          <input name="customFields" type="checkbox" class="checkbox" checked />
          {{'dataImport.labels.customFields' | translate}}
        </label>
        <label class="label">
          <input name="privacyBuckets" type="checkbox" class="checkbox" checked />
          {{'dataImport.labels.privacyBuckets' | translate}}
        </label>
        <label class="label">
          <input name="truncate" type="checkbox" class="checkbox" />
          {{'dataImport.labels.truncate' | translate}}
        </label>
      </fieldset>
      <div class="text-center mt-2">
        <button type="submit" class="btn btn-primary w-full sm:w-1/2 md:w-1/3" [disabled]="importing()">
          @if (importing()) {
            <span class="loading loading-spinner"></span>
          }
          {{'actions.confirm' | translate}}
        </button>
      </div>
    </form>
  </main>
</app-nav-page-container>

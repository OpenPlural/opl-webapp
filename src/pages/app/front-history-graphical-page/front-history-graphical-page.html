<div class="p-2 w-full flex sm:flex-row flex-col justify-between gap-2">
  <input id="historyStart" type="date" class="input input-bordered w-full" [value]="historyStart()" (change)="changeHistoryStart($event)">
  <app-vertical-center>
    <span class="hidden sm:inline"><i class="fa fa-caret-right"></i></span>
    <span class="inline sm:hidden mx-auto"><i class="fa fa-caret-down"></i></span>
  </app-vertical-center>
  <input id="historyEnd" type="date" class="input input-bordered w-full" [value]="historyEnd()" (change)="changeHistoryEnd($event)">
</div>
@let history = renderedHistory();
@if (history) {
  <div class="mt-2 scroll-container flex flex-col" (click)="selectEntry(null, $event)">
    <div class="overflow-auto">
      <div class="relative h-screen">
        <div class="absolute">
          <div class="flex flex-col pr-2 border-r-base-100 border-r-2" style="width:120px">
            @for (day of days(); track day) {
              <span class="h-10 ml-2 font-bold">{{day}}</span>
              @for (hour of hours(); track hour) {
                <span class="h-10 ml-2 text-xs">{{hour}}</span>
              }
            }
          </div>
          <div class="absolute top-0 right-0 h-full" style="width: calc(100% - 120px); left: 120px">
            @let selectedEntry = this.selectedEntry();
            @for (entry of history; track entry.entry.id) {
              <app-historic-front-entry
                [frontEntry]="entry.entry"
                [graphical]="true"
                [member]="entry.member"
                [column]="entry.column"
                [row]="entry.row"
                [height]="entry.height"
                [selected]="selectedEntry === entry.entry.id"
                (onSelected)="selectEntry(entry.entry.id, $event)" />
            }
          </div>
        </div>
      </div>
    </div>
  </div>
} @else {
  <app-loading />
}

<div class="w-full flex">
  @let m = member();
  <app-list-item containerClass="mx-2 mt-2" [color]="m.color" (action)="action.emit()">
    @if (m.archived) {
      <app-vertical-center>
        <i class="fa fa-archive fa-lg text-accent mr-3"></i>
      </app-vertical-center>
    }
    <app-vertical-center>
      <app-profile-picture [avatarUrl]="m.avatar" />
    </app-vertical-center>
    <app-vertical-center>
      <span class="text-left ml-1">
        <p class="wrap-anywhere">{{m.name}}</p>
        <p class="wrap-anywhere font-light text-base-content/60">{{m.pronouns}}</p>
      </span>
    </app-vertical-center>
  </app-list-item>
  @if (editable()) {
    <div class="mt-2 mr-2">
      <app-vertical-center>
        <button class="btn btn-outline btn-lg px-7 border-2 delay-0" [style]="fronting() ? 'border-color: ' + cssColor() : ''" (click)="toggleFronting()">
          @if (fronting()) {
            <i class="fa fa-lg fa-arrow-down" aria-hidden="true"></i>
            <span class="sr-only">{{'unfront' | translate}}</span>
          } @else {
            <i class="fa fa-lg fa-plus" aria-hidden="true"></i>
            <span class="sr-only">{{'front' | translate}}</span>
          }
        </button>
      </app-vertical-center>
    </div>
  }
</div>

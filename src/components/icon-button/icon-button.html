<button class="btn btn-ghost btn-circle btn-lg {{buttonClass()}}" aria-label="{{name() | translate}}" (click)="action.emit()">
  @if (stack()) {
    <span class="fa-stack {{size()}}" aria-hidden="true">
      @for (icon of this.icon(); track icon) {
        <i class="fa {{icon}}" aria-hidden="true"></i>
      }
    </span>
  } @else {
    <i class="fa {{size()}} {{icon()}}" aria-hidden="true"></i>
  }
</button>

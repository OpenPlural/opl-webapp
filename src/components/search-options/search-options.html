<app-vertical-center>
  <app-icon-button name="members.labels.searchOptions" icon="fa-search-plus" (action)="openDialog('searchOptionPrompt')" />
</app-vertical-center>

<dialog id="searchOptionPrompt" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{'members.labels.searchOptions' | translate}}</h3>
    <form method="dialog" class="w-full" (submit)="submitSearchOptions($event)">
      <div class="flex flex-col gap-2 mt-2">
        @let flags = this.flags();
        <label class="label">
          <input name="searchName" type="checkbox" class="checkbox" [checked]="flags.name">
          {{'fields.name' | translate}}
        </label>
        <label class="label">
          <input name="searchPronouns" type="checkbox" class="checkbox" [checked]="flags.pronouns">
          {{'fields.pronouns' | translate}}
        </label>
        <label class="label">
          <input name="searchDesc" type="checkbox" class="checkbox" [checked]="flags.description">
          {{'fields.description' | translate}}
        </label>
        @if (canSearchCustomFields()) {
          <label class="label">
            <input name="searchFields" type="checkbox" class="checkbox" [checked]="flags.customFields">
            {{'fields.customFields' | translate}}
          </label>
        }
        <label class="label">
          <input name="showArchived" type="checkbox" class="checkbox" [checked]="flags.archived">
          {{'members.labels.archived' | translate}}
        </label>
      </div>
      <button type="submit" class="mx-auto mt-5 block btn btn-success">{{'actions.confirm' | translate}}</button>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button></button>
  </form>
</dialog>

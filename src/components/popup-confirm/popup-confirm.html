@let confirmations = this.confirmations();
<dialog [id]="dialogId()" class="modal" (close)="resetCount()">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{title() | translate}}</h3>
    <p class="py-4">
      <ng-content></ng-content>
    </p>
    <div class="modal-action">
      <form method="dialog">
        <button class="btn btn-ghost btn-error text-lg">
          <i class="fa fa-times-circle" aria-hidden="true"></i>
          {{'no' | translate}}
        </button>
        @if (confirmations > 1) {
          @let count = this.count();
          <button [type]="count + 1 < confirmations ? 'button' : 'submit'" class="btn btn-ghost btn-success text-lg" (click)="increaseCount()">
            <i class="fa fa-check-circle" aria-hidden="true"></i>
            {{(count === 0 ? 'yes' : 'yes with count') | translate:{count, total: confirmations} }}
          </button>
        } @else {
          <button class="btn btn-ghost btn-success text-lg" (click)="confirm.emit()">
            <i class="fa fa-check-circle" aria-hidden="true"></i>
            {{'yes' | translate}}
          </button>
        }
      </form>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button></button>
  </form>
</dialog>

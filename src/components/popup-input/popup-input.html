<dialog [id]="dialogId()" class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">{{title() | translate}}</h3>
    <form method="dialog" class="w-full" (submit)="submitForm($event)">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">{{label() | translate}}</legend>
        <input name="value" [type]="inputType()" class="input w-full" [value]="initialValue()">
      </fieldset>
      <button type="submit" class="mx-auto mt-5 block btn btn-success">{{'actions.confirm' | translate}}</button>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop">
    <button></button>
  </form>
</dialog>
